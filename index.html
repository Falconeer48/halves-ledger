function emptyLedger() {
  return {
    people: { a: { id: "a", name: "Alex" }, b: { id: "b", name: "Sam" } },
    settings: { propertyName: "Home", currency: "ZAR", jointName: "Capitec" },
    contracts: [], house: [], rentals: [], trips: [], expenses: [], transfers: []
  };
}

function clone(v) { return JSON.parse(JSON.stringify(v)); }

function looksLikeRentalIncome(h) {
  if (!h) return false;
  if (h.rental === "income") return true;
  if (h.rental === "cost" || h.rental === "off") return false;
  return /rental paid|rent received|rental income|rent for/i.test(h.name || "");
}
function listFor(kind) {
  if (kind === "contract") return state.contracts;
  if (kind === "house") return state.house;
  if (kind === "rental") return state.rentals;
  if (kind === "trip") return state.trips;
  return [];
}
function itemOf(kind, id) {
  return listFor(kind).find(x => x.id === id) || null;
}
function kindPath(kind) {
  return { contract: "contracts", house: "house", rental: "rental", trip: "trips" }[kind] || "";
}
function kindTitle(kind) {
  return { contract: "Contracts", house: "House", rental: "Rental income", trip: "Trips" }[kind] || kind;
}

function normalize(d) {
  d.house = d.house || d.houseCategories || [];
  d.contracts = d.contracts || [];
  d.trips = d.trips || [];
  d.rentals = d.rentals || [];
  d.transfers = d.transfers || [];
  d.expenses = d.expenses || [];
  d.settings = d.settings || {};
  if (!d.settings.jointName || /^capitec(\s+rent(al)?)?$/i.test(d.settings.jointName)) d.settings.jointName = "Capitec";
  const keep = [];
  let moved = false;
  for (const h of d.house) {
    if (looksLikeRentalIncome(h)) {
      if (!d.rentals.some(r => r.id === h.id)) d.rentals.push({ ...h, rental: "income" });
      moved = true;
    } else keep.push(h);
  }
  d.house = keep;
  const rentalIds = new Set(d.rentals.map(r => r.id));
  for (const e of d.expenses) {
    if (rentalIds.has(e.targetId) && e.kind !== "rental") {
      e.kind = "rental";
      e.income = true;
      moved = true;
    }
  }
  for (const t of d.transfers) {
    if (rentalIds.has(t.targetId) && t.kind === "house") {
      t.kind = "rental";
      moved = true;
    }
  }
  d._rentalsMoved = moved;
  return d;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return normalize(clone(DEMO));
    const d = JSON.parse(raw);
    if (!d || !d.people || !d.expenses) return normalize(clone(DEMO));
    return normalize(d);
  } catch {
    return normalize(clone(DEMO));
  }
}

function pin() {
  return (localStorage.getItem("halves-pin") || "").trim();
}

let state = loadLocal();

let serverAt = "";

function persistable() {
  const d = clone(state);

}

  try {
    const r = await fetch("/api/ledger", { credentials: "same-origin" });
    if (r.status === 401) {

    if (!r.ok) return false;
    const j = await r.json();
    if (j.ledger && j.ledger.people && Array.isArray(j.ledger.expenses)) {
      state = normalize(j.ledger);
      const moved = !!state._rentalsMoved;
      delete state._rentalsMoved;
      localStorage.setItem(KEY, JSON.stringify(state));
      serverOk = true;

      box.innerHTML = `Coded in rand: <strong>${esc(moneyZar(cents))}</strong>`;
    } else if (zar == null) {
      box.innerHTML = `No ZAR rate for ${esc(ccy)}. Refresh the live rate or type one.`;
    } else {
      box.innerHTML = `${esc(moneyIn(cents, ccy))} → <strong>${esc(moneyZar(zar))}</strong><div class="muted">${esc(fxLine(ccy))}. This ZAR amount is stored on save.</div>`;
    }
  };
  form.kind.addEventListener("change", () => {
    const k = form.kind.value;
    const t = targetsFor(k);
    form.targetId.innerHTML = t.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("") || "<option value=''>None yet</option>";
    if (k === "trip") {
      const tc = tripOf(form.targetId.value)?.currency;
      if (tc) form.currency.value = tc;
    } else {
      form.currency.value = state.settings.currency || "ZAR";
    }
    const live = zarPerUnit(form.currency.value);
    if (live) form.fxRate.value = live.toFixed(4);
    syncFx();
  });
  form.targetId.addEventListener("change", () => {
    if (form.kind.value === "trip") {
      const tc = tripOf(form.targetId.value)?.currency;
      if (tc) {
        form.currency.value = tc;
        const live = zarPerUnit(tc);
        if (live) form.fxRate.value = live.toFixed(4);
      }
    }
    syncFx();
  });
  form.amount.addEventListener("input", syncFx);
  form.currency.addEventListener("change", () => {
    const live = zarPerUnit(form.currency.value);
    if (live) form.fxRate.value = live.toFixed(4);
    syncFx();
  });
  form.fxRate.addEventListener("input", () => { form.fxRate.dataset.locked = "1"; syncFx(); });
  document.getElementById("fx-refresh").addEventListener("click", async () => {
    const ok = await fetchFx();
    const live = zarPerUnit(form.currency.value);
    if (live) { form.fxRate.value = live.toFixed(4); delete form.fxRate.dataset.locked; }
    if (!ok && !live) alert("Could not fetch a live rate. Type the bank rate yourself.");
    syncFx();
  });
  syncFx();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const cents = dollarsToCents(form.amount.value);
    if (cents == null || !form.targetId.value) return;
    const ccy = form.currency.value || state.settings.currency;
    const rate = Number(form.fxRate.value);
    const zar = toZarCents(cents, ccy, rate);
    const row = {
      id: existing?.id || uid(),
      kind: form.kind.value,
      targetId: form.targetId.value,
      date: form.date.value,
      description: form.description.value.trim(),
      amountCents: cents,
      paidBy: form.paidBy.value,
      splitA: existing?.splitA ?? 50,
      repayment,
      income: !repayment && (form.kind.value === "rental" || rentalRole(itemOf(form.kind.value, form.targetId.value)) === "income"),
      currency: ccy,
      fxRate: ccy === "ZAR" ? 1 : (rate || null),
      fxDate: fx.date || today(),
      zarCents: zar
    };
    if (existing) state.expenses = state.expenses.map(x => x.id === existing.id ? row : x);
    else state.expenses.push(row);
    save(); closeDialog(); render();
  });
  const del = document.getElementById("del-pay-btn");
  if (del) del.addEventListener("click", () => {
    if (!confirm("Delete this payment?")) return;
    state.expenses = state.expenses.filter(x => x.id !== existing.id);
    save(); closeDialog(); render();
  });
}

function iouBuckets() {
  const items = [];
  for (const c of state.contracts) {
    const bal = balance(filterExp("contract", c.id), filterXfer("contract", c.id));
    if (!bal.even) items.push({ kind: "contract", id: c.id, name: "Contract · " + c.name, bal });
  }
  for (const h of state.house) {
    if (rentalRole(h) === "income") continue;
    const bal = balance(filterExp("house", h.id), filterXfer("house", h.id));
    if (!bal.even) items.push({ kind: "house", id: h.id, name: "House · " + h.name, bal });
  }
  for (const t of state.trips) {
    const bal = balance(filterExp("trip", t.id), filterXfer("trip", t.id));
    if (!bal.even) items.push({ kind: "trip", id: t.id, name: "Trip · " + t.name, bal });
  }
  return items;
}

function settleDialog(preset) {
  const existing = preset?.id ? state.transfers.find(t => t.id === preset.id) : null;
  const overall = balance(state.expenses, state.transfers);
  const fromId = existing?.from || overall.debtor || "a";
  const toId = existing?.to || overall.creditor || "b";
  const scope = existing?.kind || "overall";
  const startAmt = existing ? (existing.amountCents / 100).toFixed(2) : (overall.even ? "" : (overall.owed / 100).toFixed(2));
  openDialog(`
    <h2>${existing ? "Edit transfer" : "Settle up"}</h2>
    <p class="muted">${existing ? "Change this one transfer." : "If someone pays two (or more) outstanding amounts in one lump sum, tick those lines. The total fills in from what you tick. Turn off “offset specific amounts” to keep a single overall transfer."}</p>
    <form id="settle-form">
      <label>Date</label>
      <input type="date" name="date" value="${esc(existing?.date || today())}" required />
      <label>From</label>
      <select name="from">
        <option value="a" ${fromId==="a"?"selected":""}>${esc(nameOf("a"))}</option>
        <option value="b" ${fromId==="b"?"selected":""}>${esc(nameOf("b"))}</option>
      </select>
      <label>To</label>
      <select name="to">
        <option value="b" ${toId==="b"?"selected":""}>${esc(nameOf("b"))}</option>
        <option value="a" ${toId==="a"?"selected":""}>${esc(nameOf("a"))}</option>
      </select>
      <label>Amount</label>
      <input name="amount" type="number" min="0" step="0.01" required value="${startAmt}" />
      ${existing ? `
      <label>Apply to</label>
      <select name="scope">
        <option value="overall" ${scope==="overall"?"selected":""}>Overall balance</option>
        <option value="contract" ${scope==="contract"?"selected":""}>A contract</option>
        <option value="house" ${scope==="house"?"selected":""}>A house category</option>
        <option value="trip" ${scope==="trip"?"selected":""}>A trip</option>
      </select>
      <label>If scoped, pick one</label>
      <select name="targetId"><option value="">—</option></select>
      ` : `
      <label class="check"><input type="checkbox" name="splitAlloc" checked /><span>Offset specific outstanding amounts</span></label>
      <div id="alloc-wrap">
        <div class="alloc-head">
          <span>Tick what this payment covers</span>
          <span>
            <button type="button" id="alloc-all">Tick all</button>
            ·
            <button type="button" id="alloc-none">Clear</button>
          </span>
        </div>
        <div id="alloc-box"></div>
        <p class="muted" id="alloc-remain"></p>
      </div>
      `}
      <label>Note</label>
      <input name="notes" placeholder="Optional" value="${esc(existing?.notes || "")}" />
      <div class="toolbar" style="margin-top:18px">
        <button class="btn" type="submit">${existing ? "Save transfer" : "Save settlement"}</button>
        <button class="btn ghost" type="button" data-act="close">Cancel</button>
        ${existing ? `<button class="btn danger" type="button" id="del-xfer-btn">Delete</button>` : ""}
      </div>
    </form>
  `);
  const form = document.getElementById("settle-form");
  const fillTargets = () => {
    if (!form.scope) return;
    const k = form.scope.value;
    const t = k === "overall" ? [] : targetsFor(k);
    const selected = existing?.targetId || "";
    form.targetId.innerHTML = `<option value="">—</option>` + t.map(x => `<option value="${esc(x.id)}" ${selected===x.id?"selected":""}>${esc(x.name)}</option>`).join("");
  };
  const readAmt = () => dollarsToCents(form.amount.value) || 0;
  const tickedParts = () => {
    const parts = [];
    document.querySelectorAll("#alloc-box .alloc-pick:checked").forEach(cb => {
      const row = cb.closest(".alloc-row");
      const inp = row?.querySelector(".alloc-amt");
      const c = dollarsToCents(inp?.value) || 0;
      if (!c) return;
      parts.push({ kind: cb.getAttribute("data-kind"), targetId: cb.getAttribute("data-id"), amountCents: c });
    });
    return parts;
  };
  const tickedTotal = () => tickedParts().reduce((s, p) => s + p.amountCents, 0);
  const syncAmountFromTicks = () => {
    if (!form.splitAlloc || !form.splitAlloc.checked) return;
    const used = tickedTotal();
    form.amount.value = used ? (used / 100).toFixed(2) : "";
  };
  const updateRemain = () => {
    const el = document.getElementById("alloc-remain");
    if (!el) return;
    const n = document.querySelectorAll("#alloc-box .alloc-pick:checked").length;
    const amt = readAmt();
    const used = tickedTotal();
    const rem = amt - used;
    if (!n) {
      el.textContent = "Tick the outstanding amounts this lump sum is meant to pay.";
      el.className = "muted";
    } else if (rem < 0) {
      el.textContent = money(-rem) + " over the payment — reduce a ticked line or raise the total.";
      el.className = "muted owe";
    } else if (rem === 0) {
      el.textContent = n === 1 ? "This payment covers the ticked amount." : "This payment covers the " + n + " ticked amounts.";
      el.className = "muted";
    } else {
      el.textContent = money(rem) + " leftover stays on overall.";
      el.className = "muted";
    }
  };
  const setRow = (cb, on) => {
    cb.checked = on;
    const inp = cb.closest(".alloc-row")?.querySelector(".alloc-amt");
    if (!inp) return;
    inp.disabled = !on;
    inp.value = on ? (Number(cb.getAttribute("data-owed") || 0) / 100).toFixed(2) : "0.00";
  };
  const paintAlloc = () => {
    const box = document.getElementById("alloc-box");
    const wrap = document.getElementById("alloc-wrap");
    if (!box || !wrap) return;
    const splitOn = !form.splitAlloc || form.splitAlloc.checked;
    wrap.style.display = splitOn ? "block" : "none";
    if (!splitOn) return;
    const from = form.from.value;
    const to = form.to.value;
    const items = iouBuckets().filter(it => it.bal.debtor === from && it.bal.creditor === to);
    if (!items.length) {
      box.innerHTML = `<p class="muted" style="margin:8px 0">No open House, Contract, or Trip balances this way. The whole amount will sit on overall.</p>`;
      updateRemain();
      return;
    }
    box.innerHTML = items.map(it => `
      <div class="alloc-row">
        <label class="alloc-copy">
          <input type="checkbox" class="alloc-pick" data-kind="${esc(it.kind)}" data-id="${esc(it.id)}" data-owed="${it.bal.owed}" />
          <span>
            <div>${esc(it.name)}</div>
            <div class="muted">${esc(nameOf(it.bal.debtor))} owes ${esc(money(it.bal.owed))}</div>
          </span>
        </label>
        <input type="number" class="alloc-amt" min="0" step="0.01" value="0.00" disabled />
      </div>`).join("");
    box.querySelectorAll(".alloc-pick").forEach(cb => cb.addEventListener("change", () => {
      setRow(cb, cb.checked);
      syncAmountFromTicks();
      updateRemain();
    }));
    box.querySelectorAll(".alloc-amt").forEach(inp => inp.addEventListener("input", () => {
      syncAmountFromTicks();
      updateRemain();
    }));
    updateRemain();
  };
  if (form.scope) {
    form.scope.addEventListener("change", fillTargets);
    fillTargets();
  }
  if (!existing) {
    form.from.addEventListener("change", paintAlloc);
    form.to.addEventListener("change", paintAlloc);
    form.amount.addEventListener("input", updateRemain);
    if (form.splitAlloc) form.splitAlloc.addEventListener("change", paintAlloc);
    document.getElementById("alloc-all")?.addEventListener("click", () => {
      document.querySelectorAll("#alloc-box .alloc-pick").forEach(cb => setRow(cb, true));
      syncAmountFromTicks();
      updateRemain();
    });
    document.getElementById("alloc-none")?.addEventListener("click", () => {
      document.querySelectorAll("#alloc-box .alloc-pick").forEach(cb => setRow(cb, false));
      syncAmountFromTicks();
      updateRemain();
    });
    paintAlloc();
  }
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const cents = dollarsToCents(form.amount.value);
    if (cents == null || form.from.value === form.to.value) return;
    const date = form.date.value;
    const notes = form.notes.value.trim();
    if (existing) {
      const row = {
        id: existing.id, date, amountCents: cents,
        from: form.from.value, to: form.to.value,
        kind: form.scope.value, targetId: form.targetId.value || null, notes
      };
      state.transfers = state.transfers.map(x => x.id === existing.id ? row : x);
      save(); closeDialog(); render();
      return;
    }
    const splitOn = form.splitAlloc && form.splitAlloc.checked;
    if (!splitOn) {
      state.transfers.push({
        id: uid(), date, amountCents: cents,
        from: form.from.value, to: form.to.value,
        kind: "overall", targetId: null, notes
      });
      save(); closeDialog(); render();
      return;
    }
    const parts = tickedParts();
    const used = parts.reduce((s, p) => s + p.amountCents, 0);
    if (!parts.length) {
      alert("Tick the outstanding amounts this payment is meant to cover.");
      return;
    }
    if (used > cents) {
      alert("The ticked amounts add up to more than the payment. Untick a line or raise the total.");
      return;
    }
    const batchId = uid();
    const label = notes || ("Settle-up split of " + money(cents));
    for (const p of parts) {
      state.transfers.push({
        id: uid(), date, amountCents: p.amountCents,
        from: form.from.value, to: form.to.value,
        kind: p.kind, targetId: p.targetId, notes: label, batchId
      });
    }
    const rem = cents - used;
    if (rem > 0) {
      state.transfers.push({
        id: uid(), date, amountCents: rem,
        from: form.from.value, to: form.to.value,
        kind: "overall", targetId: null, notes: label, batchId
      });
    }
    if (!parts.length && rem <= 0) return;
    save(); closeDialog(); render();
  });
  const del = document.getElementById("del-xfer-btn");
  if (del) del.addEventListener("click", () => {
    if (!confirm("Delete this transfer?")) return;
    state.transfers = state.transfers.filter(x => x.id !== existing.id);
    save(); closeDialog(); render();
  });
}

function entityDialog(kind, existing) {
  const titles = { contract: "Contract", house: "House cost", trip: "Trip", rental: "Rental income" };
  const isTrip = kind === "trip";
  const isCon = kind === "contract";
  const isRent = kind === "rental";
  openDialog(`
    <h2>${existing ? "Edit" : "New"} ${titles[kind]}</h2>
    <form id="ent-form">
      <label>Name</label>
      <input name="name" required value="${esc(existing?.name || "")}" />
      ${isCon ? `<label>Vendor</label><input name="vendor" value="${esc(existing?.vendor || "")}" />` : ""}
      <label>${isCon ? "Contract total (amount due to the contractor)" : isTrip ? "Expected trip budget (optional)" : isRent ? "Expected monthly rent (optional)" : "Expected total (optional)"}</label>
      <input name="total" type="number" min="0" step="0.01" value="${existing?.totalCents != null ? (existing.totalCents/100).toFixed(2) : ""}" />
      <label>${esc(nameOf("a"))}’s share of this total (%)</label>
      <input name="splitA" type="number" min="0" max="100" step="1" value="${existing?.splitA ?? 50}" />
      <p class="muted">${isCon ? "Who owes whom and still-to-pay both use this share, then subtract what each of you has already paid the contractor." : isRent ? "Rent received into " + jointName() + " is income on the P&L, split at this share. It does not create an IOU." : "Who owes whom is this share of what was spent, minus what each of you paid. Leave the total blank if you only want to track spend. For a refundable deposit, 100% is fine if only one of you paid it."}</p>
      ${kind === "house" ? `<label class="check"><input type="checkbox" name="refundable" ${isRefundable(existing) ? "checked" : ""} /><span>Refundable deposit — they will pay this back later (Oasis-style). Need not be 50/50. Stays off the P&amp;L.</span></label>
      <label>Rental P&amp;L</label>
      <select name="rental">
        <option value="cost" ${rentalRole(existing) === "cost" ? "selected" : ""}>Cost (claimable — rates, utilities, Oasis, painting, floors)</option>
        <option value="off" ${rentalRole(existing) === "off" ? "selected" : ""}>Do not include</option>
      </select>
      <p class="muted">House costs show on the rental P&amp;L by default. Record rent under Rental income, not here. Paid from ${esc(jointName())} still splits at the share above, with no IOU.</p>
      <label>Notes</label><textarea name="notes">${esc(existing?.notes || "")}</textarea>` : ""}
      ${isRent ? `<label>Notes</label><textarea name="notes">${esc(existing?.notes || "")}</textarea>` : ""}
      ${isTrip ? `<label>Location</label><input name="location" value="${esc(existing?.location || "")}" />
        <label>Trip currency</label>
        <select name="currency">${currencyOpts(existing?.currency || "USD")}</select>
        <p class="muted">Payments on this trip are entered in this currency and coded to rand at the live rate (you can override per payment).</p>
        <label>Start</label><input type="date" name="startDate" value="${esc(existing?.startDate || "")}" />
        <label>End</label><input type="date" name="endDate" value="${esc(existing?.endDate || "")}" />
        <label>Notes</label><textarea name="notes">${esc(existing?.notes || "")}</textarea>` : ""}
      ${isCon ? `<label>Rental P&amp;L</label>
      <select name="rental">
        <option value="cost" ${rentalRole(existing) !== "off" ? "selected" : ""}>Cost (claimable — painting, floors, other contracts)</option>
        <option value="off" ${rentalRole(existing) === "off" ? "selected" : ""}>Do not include</option>
      </select>
      <p class="muted">Contract payments already made show as costs on the P&amp;L (your share each). Refundable deposits do not.</p>
      <label>Notes</label><textarea name="notes">${esc(existing?.notes || "")}</textarea>` : ""}
      <div class="toolbar" style="margin-top:18px">
        <button class="btn" type="submit">Save</button>
        <button class="btn ghost" type="button" data-act="close">Cancel</button>
        ${existing ? `<button class="btn danger" type="button" id="del-ent">Delete</button>` : ""}
      </div>
    </form>
  `);
  const form = document.getElementById("ent-form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = form.name.value.trim();
    if (!name) return;
    const total = form.total.value ? dollarsToCents(form.total.value) : null;
    const splitRaw = Number(form.splitA.value);
    const splitA = Number.isFinite(splitRaw) ? Math.max(0, Math.min(100, splitRaw)) : 50;
    if (kind === "contract") {
      const row = { id: existing?.id || uid(), name, vendor: form.vendor.value.trim(), totalCents: total, splitA, notes: form.notes.value.trim(), rental: form.rental ? form.rental.value : "cost", createdAt: existing?.createdAt || new Date().toISOString() };
      if (existing) state.contracts = state.contracts.map(x => x.id === existing.id ? row : x);
      else state.contracts.push(row);
    } else if (kind === "house") {
      const row = { id: existing?.id || uid(), name, notes: form.notes.value.trim(), totalCents: total, splitA, refundable: !!(form.refundable && form.refundable.checked), rental: form.rental ? form.rental.value : "cost", createdAt: existing?.createdAt || new Date().toISOString() };
      if (existing) state.house = state.house.map(x => x.id === existing.id ? row : x);
      else state.house.push(row);
    } else if (kind === "rental") {
      const row = { id: existing?.id || uid(), name, notes: form.notes.value.trim(), totalCents: total, splitA, rental: "income", createdAt: existing?.createdAt || new Date().toISOString() };
      if (existing) state.rentals = state.rentals.map(x => x.id === existing.id ? row : x);
      else state.rentals.push(row);
    } else {
      const row = { id: existing?.id || uid(), name, location: form.location.value.trim(), startDate: form.startDate.value, endDate: form.endDate.value, notes: form.notes.value.trim(), currency: form.currency.value || "USD", totalCents: total, splitA, createdAt: existing?.createdAt || new Date().toISOString() };
      if (existing) state.trips = state.trips.map(x => x.id === existing.id ? row : x);
      else state.trips.push(row);
    }
    save(); closeDialog(); render();
  });
  const del = document.getElementById("del-ent");
  if (del) del.addEventListener("click", () => {
    if (!confirm("Delete this? Payments against it will stay unless you delete those too.")) return;
    if (confirm("Also delete the payments and transfers recorded against it?")) {
      state.expenses = state.expenses.filter(x => !(x.kind === kind && x.targetId === existing.id));
      state.transfers = state.transfers.filter(x => !(x.kind === kind && x.targetId === existing.id));
    }
    if (kind === "contract") state.contracts = state.contracts.filter(x => x.id !== existing.id);
    if (kind === "house") state.house = state.house.filter(x => x.id !== existing.id);
    if (kind === "rental") state.rentals = state.rentals.filter(x => x.id !== existing.id);
    if (kind === "trip") state.trips = state.trips.filter(x => x.id !== existing.id);
    save(); closeDialog(); location.hash = "#/" + (kindPath(kind) || "contracts");
  });
}

function splitLabel(e) {
  if (isRepayment(e)) return "repayment to " + nameOf(e.paidBy);
  if (isIncomeExp(e)) return "income · " + ((e.splitA ?? splitPctA(itemForExpense(e))) === 50 ? "50/50" : `split ${e.splitA ?? 50}/${100 - (e.splitA ?? 50)}`);
  const a = e.splitA ?? 50;
  if (a === 50) return "50/50";
  if ((e.paidBy === "a" && a === 100) || (e.paidBy === "b" && a === 0)) return "own share";
  return `split ${a}/${100 - a}`;
}

function rowActs(actEdit, actDel, id) {
  return `<div class="row-acts">
      <button type="button" class="btn ghost sm" data-act="${actEdit}" data-id="${esc(id)}">Edit</button>
      <button type="button" class="btn ghost sm" data-act="${actDel}" data-id="${esc(id)}">Delete</button>
    </div>`;
}

function expenseRows(list) {
  if (!list.length) return `<div class="empty">No payments yet.</div>`;
  return list.slice().sort((a,b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1)).map(e => `
    <div class="list-row">
      <div>
        <div>${esc(e.description)}${isRepayment(e) ? " <span class=\"credit\">(repayment)</span>" : isIncomeExp(e) ? " <span class=\"credit\">(income)</span>" : ""}</div>
        <div class="muted">${prettyDate(e.date)} · ${esc(isIncomeExp(e) ? nameOf(e.paidBy) + " received" : isRepayment(e) ? nameOf(e.paidBy) + " received" : nameOf(e.paidBy) + " paid")} · ${esc(splitLabel(e))}${expenseCurrency(e) && expenseCurrency(e) !== (state.settings.currency||"ZAR") ? " · " + moneyIn(e.amountCents, expenseCurrency(e)) : ""}${(() => {
          const item = itemOf(e.kind, e.targetId);
          if (!item) return "";
          const r = remainingByPerson(item, filterExp(e.kind, e.targetId), filterXfer(e.kind, e.targetId));
          if (r.refundable && r.held > 0) return " · still to be repaid " + esc(money(r.held));
          if (r.refundable) return " · repaid in full";
          if (r.hasBudget && r.remaining <= 0) return " · paid in full";
          if (r.hasBudget) return ` · still ${esc(nameOf("a"))} ${money(Math.max(0, r.stillA))}, ${esc(nameOf("b"))} ${money(Math.max(0, r.stillB))}`;
          return "";
        })()}</div>

}

function renderList(kind) {
  const cfg = {
    contract: { title: "Contracts", add: "New contract", items: state.contracts, href: (id) => "/contracts/" + id, empty: "No contracts yet. Add a builder, solar, or service agreement." },

  }[kind];

      const ccy = item.currency || "ZAR";

      meta = [meta, "Rental income"].filter(Boolean).join(" · ");

    ${kind === "rental" ? `<p class="lede">Record rent as it hits <strong>${esc(jointName())}</strong>. Split is usually 50/50. This is income on the P&amp;L, not a house cost.</p>` : ""}
    <div class="toolbar">
      <button class="btn" data-act="entity" data-kind="${kind}">${cfg.add}</button>
      <button class="btn ghost" data-act="pay" data-kind="${kind}">${kind === "rental" ? "Record income" : "Add payment"}</button>

function renderDetail(kind, id) {

function itemName(kind, id) {
  return itemOf(kind, id)?.name || (kind === "overall" ? "Overall" : id);
}
function categoryLabel(kind) {
  return { contract: "Contract", house: "House", rental: "Rental", trip: "Trip", overall: "Overall" }[kind] || kind || "";
}
function xNum(cents) { return ((cents || 0) / 100).toFixed(2); }
function itemForExpense(e) {
  if (!e) return null;
  return itemOf(e.kind, e.targetId);
}
function band(cat, total) {
  if (total) return { t: "totaltxt", n: "total" };
  const c = String(cat || "");
  if (/grand total|all contractors|overall total/i.test(c)) return { t: "totaltxt", n: "total" };
  if (/contract/i.test(c)) return { t: "txtC", n: "numC" };
  if (/house/i.test(c)) return { t: "txtH", n: "numH" };
  if (/rental|income/i.test(c)) return { t: "txtO", n: "numO" };
  if (/trip/i.test(c)) return { t: "txtT", n: "numT" };
  if (/overall/i.test(c)) return { t: "txtO", n: "numO" };
  return { t: "txtN", n: "numN" };
}
function tx(v, cat, total) { return xCell(v, "String", band(cat, total).t); }
function nr(v, cat, total) { return xCell(v, "Number", band(cat, total).n); }
function xCell(value, type, style) {
  if (type === "Number") {
    const n = value == null || value === "" ? "" : String(value);
    if (n === "") return `<Cell ss:StyleID="${style || "txtN"}"><Data ss:Type="String"></Data></Cell>`;
    return `<Cell ss:StyleID="${style || "money"}"><Data ss:Type="Number">${n}</Data></Cell>`;
  }
  return `<Cell ss:StyleID="${style || "txtN"}"><Data ss:Type="String">${esc(value ?? "")}</Data></Cell>`;
}
function xRow(cells) { return `<Row>${cells.join("")}</Row>`; }
function xSheet(name, bodyRows, filter) {
  const safe = String(name).replace(/[\\/*?:\[\]]/g, " ").slice(0, 31);
  const n = bodyRows.length || 1;
  const start = (filter && filter.start) ? filter.start : 1;
  const end = (filter && filter.end) ? Math.max(filter.end, start) : n;
  const cols = (filter && filter.cols) ? filter.cols : 16;
  const rc = `R${start}C1:R${end}C${cols}`;
  const q = "'" + safe.replace(/'/g, "''") + "'";
  return `<Worksheet ss:Name="${esc(safe)}">
<Names><NamedRange ss:Name="_FilterDatabase" ss:RefersTo="=${q}!${rc}"/></Names>
<Table>
<Column ss:AutoFitWidth="0" ss:Width="150"/>
<Column ss:AutoFitWidth="0" ss:Width="140" ss:Span="18"/>
${bodyRows.join("")}
</Table>
<AutoFilter x:Range="${rc}" xmlns="urn:schemas-microsoft-com:office:excel"></AutoFilter>
<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DoNotDisplayGridlines/></WorksheetOptions>
</Worksheet>`;
}
function headerRow(cols) {
  return `<Row ss:Height="36">${cols.map(h => xCell(h, "String", "header")).join("")}</Row>`;
}
function filterAt(body, headerHtml, colCount) {
  const i = body.indexOf(headerHtml);
  const start = i >= 0 ? i + 1 : 1;
  const end = Math.max(start + 1, body.length);
  return { start, end, cols: colCount };
}
function sectionRow(text, span, style) {
  return `<Row><Cell ss:StyleID="${style || "section"}" ss:MergeAcross="${Math.max(0, (span || 8) - 1)}"><Data ss:Type="String">${esc(text)}</Data></Cell></Row>`;
}
function blankRow() { return `<Row></Row>`; }
function pivotBlock(title, headers, rows, tone) {
  return [sectionRow(title, headers.length, tone), headerRow(headers), ...rows, blankRow()];
}
function oweSentence(label, b) {
  if (!b || b.even) return `${label}: Settled — nobody owes anyone`;
  return `${label}: ${nameOf(b.debtor)} owes ${nameOf(b.creditor)} ${money(b.owed)}`;
}
function catBalance(buckets, cat) {
  const list = buckets.filter(g => g.cat === cat);
  return balance(list.flatMap(g => g.exp), list.flatMap(g => g.xf));
}
function reportBuckets(from, to) {
  const groups = [
    { cat: "Overall", name: "All categories", kind: "overall", id: null, exp: filterExp(null, null, from, to), xf: state.transfers.filter(t => (!from || t.date >= from) && (!to || t.date <= to)) },
    ...state.contracts.map(c => ({ cat: "Contract", name: c.name, kind: "contract", id: c.id, totalCents: c.totalCents, splitA: c.splitA, exp: filterExp("contract", c.id, from, to), xf: filterXfer("contract", c.id, from, to) })),
    ...state.house.map(c => ({ cat: "House", name: c.name, kind: "house", id: c.id, totalCents: c.totalCents, splitA: c.splitA, refundable: c.refundable, exp: filterExp("house", c.id, from, to), xf: filterXfer("house", c.id, from, to) })),
    ...state.rentals.map(c => ({ cat: "Rental", name: c.name, kind: "rental", id: c.id, totalCents: c.totalCents, splitA: c.splitA, exp: filterExp("rental", c.id, from, to), xf: filterXfer("rental", c.id, from, to) })),
    ...state.trips.map(c => ({ cat: "Trip", name: c.name, kind: "trip", id: c.id, totalCents: c.totalCents, splitA: c.splitA, exp: filterExp("trip", c.id, from, to), xf: filterXfer("trip", c.id, from, to) }))
  ];
  return groups.map(g => ({ ...g, bal: balance(g.exp, g.xf) }));
}
function downloadExcel() {
  const from = document.getElementById("r-from")?.value || "";
  const to = document.getElementById("r-to")?.value || "";
  const aName = nameOf("a");
  const bName = nameOf("b");
  const ledger = state.settings.currency || "ZAR";
  const buckets = reportBuckets(from, to);
  const oweText = (b) => b.even ? "Settled" : `${nameOf(b.debtor)} owes ${nameOf(b.creditor)}`;
  const cats = ["Contract", "House", "Rental", "Trip"];
  const totStyle = (n) => xCell(xNum(n), "Number", "total");

  const sumHeader = ["Category","Item","Payments","Spend ("+ledger+")", aName+" paid", bName+" paid", aName+" share", bName+" share", "Who owes", "Amount owed ("+ledger+")", "Expected total", "Still to pay", aName+" still to pay", bName+" still to pay"];
  const sumDetail = [];
  const addSum = (g, style) => {
    const b = g.bal;
    const r = remainingByPerson({ totalCents: g.totalCents, splitA: g.splitA, name: g.name, refundable: g.refundable }, g.exp, g.xf);
    const still = r.hasBudget ? Math.max(0, r.remaining) : "";
    const stillA = Math.max(0, r.stillA);
    const stillB = Math.max(0, r.stillB);
    const st = style || null;
    sumDetail.push(xRow([
      tx(g.cat, g.cat, st), tx(g.name, g.cat, st),
      nr(g.exp.length, g.cat, st), nr(xNum(b.total), g.cat, st),
      nr(xNum(b.paidA), g.cat, st), nr(xNum(b.paidB), g.cat, st),
      nr(xNum(b.shareA), g.cat, st), nr(xNum(b.shareB), g.cat, st),
      tx(oweText(b), g.cat, st), nr(xNum(b.owed), g.cat, st),
      xCell(g.totalCents != null ? xNum(g.totalCents) : "", g.totalCents != null ? "Number" : "String", g.totalCents != null ? band(g.cat, st).n : band(g.cat, st).t),
      xCell(still === "" ? "" : xNum(still), still === "" ? "String" : "Number", still === "" ? band(g.cat, st).t : band(g.cat, st).n),
      nr(xNum(stillA), g.cat, st), nr(xNum(stillB), g.cat, st)
    ]));
  };
  buckets.filter(g => g.cat !== "Overall" && (g.exp.length || g.xf.length || g.totalCents)).forEach(g => addSum(g));
  const catPivotRows = [];
  for (const cat of cats) {
    const list = buckets.filter(g => g.cat === cat);
    const exp = list.flatMap(g => g.exp);
    const xf = list.flatMap(g => g.xf);
    const b = balance(exp, xf);
    catPivotRows.push(xRow([
      tx(cat, cat), nr(list.filter(g => g.exp.length || g.xf.length).length, cat),
      nr(exp.length, cat), nr(xNum(b.total), cat), nr(xNum(b.paidA), cat), nr(xNum(b.paidB), cat),
      nr(xNum(b.shareA), cat), nr(xNum(b.shareB), cat), tx(oweText(b), cat), nr(xNum(b.owed), cat)
    ]));
  }
  const overallB = buckets.find(g => g.cat === "Overall")?.bal || balance([], []);
  catPivotRows.push(xRow([
    xCell("Grand total", "String", "totaltxt"),
    xCell(buckets.filter(g => g.cat !== "Overall" && (g.exp.length || g.xf.length)).length, "Number", "total"),
    xCell(buckets.find(g => g.cat === "Overall")?.exp.length || 0, "Number", "total"),
    totStyle(overallB.total), totStyle(overallB.paidA), totStyle(overallB.paidB),
    totStyle(overallB.shareA), totStyle(overallB.shareB),
    xCell(oweText(overallB), "String", "totaltxt"), totStyle(overallB.owed)
  ]));
  const catPivotHeader = ["Category","Items","Payments","Spend ("+ledger+")", aName+" paid", bName+" paid", aName+" share", bName+" share", "Who owes", "Amount owed ("+ledger+")"];
  const whoHeader = ["Category","Status","Who owes","Owes whom","Amount owed ("+ledger+")"];
  const whoLineRow = (label, b, total) => {
    const open = b && !b.even;
    const ts = total ? "totaltxt" : (open ? "oweOpen" : "oweSettled");
    const ns = total ? "total" : (open ? "oweOpenN" : "oweSettledN");
    return xRow([
      xCell(label, "String", ts),
      xCell(b.even ? "Settled" : "Open", "String", ts),
      xCell(b.even ? "—" : nameOf(b.debtor), "String", ts),
      xCell(b.even ? "—" : nameOf(b.creditor), "String", ts),
      xCell(xNum(b.owed), "Number", ns)

  };
  const whoRows = [
    whoLineRow("Contracts", catBalance(buckets, "Contract")),

    whoLineRow("OVERALL TOTAL", overallB, true)
  ];
  const whoBody = [
    sectionRow("Who owes whom", 5, "sectionWho"),
    xRow([xCell(oweSentence("Overall", overallB), "String", "owehead")]),
    xRow([xCell(oweSentence("Contracts", catBalance(buckets, "Contract")), "String", catBalance(buckets, "Contract").even ? "oweSettled" : "oweOpen")]),
    xRow([xCell(oweSentence("House", catBalance(buckets, "House")), "String", catBalance(buckets, "House").even ? "oweSettled" : "oweOpen")]),
    xRow([xCell(oweSentence("Trips", catBalance(buckets, "Trip")), "String", catBalance(buckets, "Trip").even ? "oweSettled" : "oweOpen")]),
    blankRow(),
    headerRow(whoHeader),
    ...whoRows,
    blankRow(),
    sectionRow("Still to pay contractors", 7, "sectionStill"),
    headerRow(["Contractor","Vendor","Contract total","Paid so far","Still to pay", aName+" still to pay", bName+" still to pay"]),
    ...state.contracts.map(c => {
      const r = remainingByPerson(c, filterExp("contract", c.id), filterXfer("contract", c.id));
      return xRow([
        xCell(c.name, "String", "txtC"), xCell(c.vendor || "", "String", "txtC"),
        xCell(c.totalCents != null ? xNum(c.totalCents) : "", c.totalCents != null ? "Number" : "String", c.totalCents != null ? "numC" : "txtC"),
        xCell(xNum(r.paid), "Number", "numC"),
        xCell(r.hasBudget ? xNum(Math.max(0, r.remaining)) : "Set a contract total", r.hasBudget ? "Number" : "String", r.hasBudget ? (r.remaining > 0 ? "oweOpenN" : "numC") : "txtC"),
        xCell(xNum(Math.max(0, r.stillA)), "Number", r.stillA > 0 ? "oweOpenN" : "numC"),
        xCell(xNum(Math.max(0, r.stillB)), "Number", r.stillB > 0 ? "oweOpenN" : "numC")
      ]);
    }),
    xRow([
      xCell("ALL CONTRACTORS", "String", "totaltxt"), xCell(""),
      xCell(xNum(outstandingFor("contract").due), "Number", "total"),
      xCell(xNum(outstandingFor("contract").paid), "Number", "total"),
      xCell(xNum(Math.max(0, outstandingFor("contract").remaining)), "Number", "total"),
      xCell(xNum(outstandingFor("contract").stillA), "Number", "total"),
      xCell(xNum(outstandingFor("contract").stillB), "Number", "total")
    ])
  ];

function pnlModel(from, to) {
  const income = [];
  const costs = [];
  const details = [];
  const addBucket = (item, kind, label) => {
    const role = rentalRole(item);
    if (role === "off") return;
    const ex = filterExp(kind, item.id, from, to).filter(e => !isRepayment(e)).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    let total = 0, shareA = 0, joint = 0, pocketA = 0, pocketB = 0;
    const pct = splitPctA(item);
    for (const e of ex) {
      const cents = Math.abs(ledgerCents(e));
      const partA = Math.round((cents * pct) / 100);
      total += cents;
      shareA += partA;
      if (e.paidBy === "a") pocketA += cents;
      else if (e.paidBy === "b") pocketB += cents;
      else if (e.paidBy === "joint") joint += cents;
      details.push({
        date: e.date, description: e.description, category: label, role,
        paidBy: e.paidBy, cents, shareA: partA, shareB: cents - partA, source: kind
      });
    }
    const line = {
      id: item.id, name: label, n: ex.length, total, shareA, shareB: total - shareA,
      joint, pocketA, pocketB, role, source: kind
    };
    if (role === "income") income.push(line);
    else costs.push(line);
  };
  for (const h of state.house) addBucket(h, "house", h.name);
  for (const r of state.rentals) addBucket(r, "rental", r.name);
  for (const c of state.contracts) addBucket(c, "contract", "Contract · " + c.name);
  details.sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.category).localeCompare(String(b.category)));
  const sum = (arr, k) => arr.reduce((s, x) => s + x[k], 0);
  const incomeTotal = sum(income, "total");
  const costTotal = sum(costs, "total");
  const incomeA = sum(income, "shareA");
  const costA = sum(costs, "shareA");
  return {
    income, costs, details,
    houseCosts: costs.filter(x => x.source === "house"),
    contractCosts: costs.filter(x => x.source === "contract"),
    incomeTotal, costTotal, profit: incomeTotal - costTotal,
    incomeA, costA, profitA: incomeA - costA,
    incomeB: incomeTotal - incomeA, costB: costTotal - costA,
    profitB: (incomeTotal - incomeA) - (costTotal - costA)
  };
}
function pnlAmt(cents, cls) {
  const n = cents || 0;
  const klass = (cls || "amt") + (n < 0 ? " owe" : n > 0 ? " credit" : "");
  return `<td class="${klass}">${esc(money(n))}</td>`;
}
function renderPnl(from, to) {
  const p = pnlModel(from, to);
  const a = nameOf("a");
  const b = nameOf("b");
  const lineRows = (arr) => arr.map(x => `
    <tr>
      <td class="name">${esc(x.name)}</td>
      ${pnlAmt(x.total, "amt")}
      ${pnlAmt(x.shareA, "amt")}
      ${pnlAmt(x.shareB, "amt")}
    </tr>`).join("") || `<tr><td class="name muted" colspan="4">None yet</td></tr>`;
  const profitCls = p.profit >= 0 ? "profit credit" : "profit owe";
  const detail = p.details.length ? p.details.map(d => `
    <tr>
      <td>${esc(prettyDate(d.date))}</td>
      <td class="name">${esc(d.description)}</td>
      <td class="name">${esc(d.category)}</td>
      <td>${esc(d.role === "income" ? "Income" : "Cost")}</td>
      <td>${esc(nameOf(d.paidBy))}</td>
      ${pnlAmt(d.role === "income" ? d.cents : -d.cents, "amt")}
      ${pnlAmt(d.role === "income" ? d.shareA : -d.shareA, "amt")}
      ${pnlAmt(d.role === "income" ? d.shareB : -d.shareB, "amt")}
    </tr>`).join("") : `<tr><td colspan="8">No rental income or costs in this range.</td></tr>`;
  return `
    <div class="card" style="overflow:auto">
      <h3>Rental profit and loss</h3>
      <p class="muted">${esc(state.settings.propertyName || "Property")} · ${esc(a)} and ${esc(b)} at the category split (usually 50/50). Includes rent, house costs (rates, utilities, Oasis fees), and contracts (painting, floors) so you can claim them. Refundable deposits stay off this statement. Paid from ${esc(jointName())} is a cost or receipt here but does not create an IOU.</p>
      <table class="pnl-table">
        <thead>
          <tr><th class="name">Account</th><th class="amt">Total</th><th class="amt">${esc(a)}</th><th class="amt">${esc(b)}</th></tr>
        </thead>
        <tbody>
          <tr class="section"><td colspan="4">Income</td></tr>
          ${lineRows(p.income)}
          <tr class="total"><td class="name">Total income</td>${pnlAmt(p.incomeTotal, "amt")}${pnlAmt(p.incomeA, "amt")}${pnlAmt(p.incomeB, "amt")}</tr>
          <tr class="section"><td colspan="4">House costs</td></tr>
          ${lineRows(p.houseCosts)}
          <tr class="section"><td colspan="4">Contracts</td></tr>
          ${lineRows(p.contractCosts)}
          <tr class="total"><td class="name">Total costs</td>${pnlAmt(p.costTotal, "amt")}${pnlAmt(p.costA, "amt")}${pnlAmt(p.costB, "amt")}</tr>
          <tr class="${profitCls}"><td class="name">${p.profit >= 0 ? "Profit" : "Loss"}</td>${pnlAmt(p.profit, "amt")}${pnlAmt(p.profitA, "amt")}${pnlAmt(p.profitB, "amt")}</tr>
        </tbody>
      </table>
    </div>
    <div class="card" style="overflow:auto;margin-top:16px">
      <h3>Rental entries</h3>
      <table class="pnl-table">
        <thead>
          <tr><th>Date</th><th class="name">Description</th><th class="name">Category</th><th>Type</th><th>Paid by</th><th class="amt">Amount</th><th class="amt">${esc(a)}</th><th class="amt">${esc(b)}</th></tr>
        </thead>
        <tbody>${detail}</tbody>
      </table>
    </div>
  `;
}

function renderPnlSheet(from, to) {
  const p = pnlModel(from, to);
  const aName = nameOf("a");
  const bName = nameOf("b");
  const head = ["Line", "Type", "Total", aName, bName];
  const rows = [
    sectionRow("Rental profit and loss — " + (state.settings.propertyName || ""), 5, "sectionWho"),
    xRow([xCell("Includes rent, house costs, and contracts (painting, floors). Refundable deposits are excluded. Paid from " + jointName() + " is included at the split, with no IOU.", "String", "oweline")]),
    blankRow(),
    headerRow(head)
  ];
  const add = (label, type, tot, sa, sb, isTotal) => {
    rows.push(xRow([
      tx(label, "House", isTotal), tx(type, "House", isTotal),
      nr(xNum(tot), "House", isTotal), nr(xNum(sa), "House", isTotal), nr(xNum(sb), "House", isTotal)
    ]));
  };
  rows.push(sectionRow("Income", 5, "sectionH"));
  for (const x of p.income) add(x.name, "Income", x.total, x.shareA, x.shareB);
  add("Total income", "Income", p.incomeTotal, p.incomeA, p.incomeB, true);
  rows.push(sectionRow("House costs", 5, "sectionH"));
  for (const x of p.houseCosts) add(x.name, "Cost", x.total, x.shareA, x.shareB);
  rows.push(sectionRow("Contracts", 5, "sectionC"));
  for (const x of p.contractCosts) add(x.name, "Cost", x.total, x.shareA, x.shareB);
  add("Total costs", "Cost", p.costTotal, p.costA, p.costB, true);
  add(p.profit >= 0 ? "Profit" : "Loss", "Result", p.profit, p.profitA, p.profitB, true);
  rows.push(blankRow());
  const dHead = ["Date", "Description", "Category", "Type", "Paid by", "Amount", aName, bName];
  rows.push(sectionRow("Entries", dHead.length, "sectionDetail"));
  rows.push(headerRow(dHead));
  if (!p.details.length) {
    rows.push(xRow([tx("No rental income or costs in this range", "House")]));
  } else {
    for (const d of p.details) {
      const sign = d.role === "income" ? 1 : -1;
      rows.push(xRow([
        tx(d.date, "House"), tx(d.description, "House"), tx(d.category, "House"),
        tx(d.role === "income" ? "Income" : "Cost", "House"), tx(nameOf(d.paidBy), "House"),
        nr(xNum(sign * d.cents), "House"), nr(xNum(sign * d.shareA), "House"), nr(xNum(sign * d.shareB), "House")
      ]));
    }
  }
  const headerHtml = headerRow(head);
  return { body: rows, head: headerHtml, cols: head.length };
}

function oweText(b) {
  if (!b || b.even) return "Settled";
  return `${nameOf(b.debtor)} owes ${nameOf(b.creditor)} ${money(b.owed)}`;
}
function whoSummaryRow(label, b, total) {
  return `<tr class="${total ? "total" : ""}">
    <td class="name">${esc(label)}</td>
    <td class="amt">${esc(money(b.total))}</td>
    <td class="amt">${esc(money(b.paidA))}</td>
    <td class="amt">${esc(money(b.paidB))}</td>
    <td class="${b.even ? "credit" : "owe"}">${esc(oweText(b))}</td>
  </tr>`;
}
function whoDetailRow(label, b, item, exp, xf) {
  const r = item ? remainingByPerson(item, exp, xf) : null;
  const leftTxt = !r ? "—" : (r.refundable && r.held > 0 ? "To be repaid " + money(r.held) : (r.hasBudget ? (r.remaining <= 0 ? (r.refundable ? "Repaid in full" : "Paid in full") : money(Math.max(0, r.remaining))) : "—"));
  const aStill = r ? money(Math.max(0, r.stillA)) : "—";
  const bStill = r ? money(Math.max(0, r.stillB)) : "—";
  return `<tr>
    <td class="name">${esc(label)}</td>
    <td class="amt">${esc(money(b.total))}</td>
    <td class="amt">${esc(money(b.paidA))}</td>
    <td class="amt">${esc(money(b.paidB))}</td>
    <td>${esc(leftTxt)}</td>
    <td>${esc(aStill)}</td>
    <td>${esc(bStill)}</td>
    <td class="${b.even ? "credit" : "owe"}">${esc(oweText(b))}</td>
  </tr>`;
}

function renderReport() {
  const from = document.getElementById("r-from")?.value || "";
  const to = document.getElementById("r-to")?.value || "";
  const overall = balance(filterExp(null, null, from, to), filterXfer("overall", null, from, to));
  const cBal = balance(filterExp("contract", null, from, to), filterXfer("contract", null, from, to));
  const hBal = balance(filterExp("house", null, from, to), filterXfer("house", null, from, to));
  const tBal = balance(filterExp("trip", null, from, to), filterXfer("trip", null, from, to));
  const a = nameOf("a");
  const b = nameOf("b");
  const group = (kind, items, title) => {
    const body = items.map(item => {
      const exp = filterExp(kind, item.id, from, to);
      const xf = filterXfer(kind, item.id, from, to);
      return whoDetailRow(item.name, balance(exp, xf), item, exp, xf);
    }).join("");
    if (!items.length) return "";
    return `<tr class="section"><td colspan="8">${esc(title)}</td></tr>${body}`;
  };
  return `
    <div class="page-kicker">Statement</div>
    <h1 class="page-title">Rental P&amp;L and who owes whom</h1>
    <p class="lede">${overall.even ? "Settled across the selected dates." : `${esc(nameOf(overall.debtor))} owes ${esc(nameOf(overall.creditor))} <strong>${esc(money(overall.owed))}</strong>.`} Rental profit is separate — it is each person’s share of rent minus rental costs, including amounts paid from ${esc(jointName())}.</p>
    <div class="toolbar">
      <label style="margin:0">From <input id="r-from" type="date" value="${esc(from)}" /></label>
      <label style="margin:0">To <input id="r-to" type="date" value="${esc(to)}" /></label>
      <button class="btn ghost sm" data-act="reprint">Apply dates</button>
      <button class="btn" data-act="excel">Download Excel</button>
      <button class="btn ghost sm" data-act="settle">Settle up</button>
      <button class="btn ghost sm" onclick="window.print()">Print</button>
    </div>
    <div class="card who-summary" style="overflow:auto">
      <h3>Who owes whom — totals</h3>
      <div class="stats four">
        <div><div class="lbl">Overall</div><div class="amount ${overall.even ? "credit" : "owe"}">${esc(oweText(overall))}</div></div>
        <div><div class="lbl">Contracts</div><div class="amount ${cBal.even ? "credit" : "owe"}">${esc(oweText(cBal))}</div></div>
        <div><div class="lbl">House</div><div class="amount ${hBal.even ? "credit" : "owe"}">${esc(oweText(hBal))}</div></div>
        <div><div class="lbl">Trips</div><div class="amount ${tBal.even ? "credit" : "owe"}">${esc(oweText(tBal))}</div></div>
      </div>
      <table class="pnl-table">
        <thead>
          <tr>
            <th class="name">Bucket</th>
            <th class="amt">Spend</th>
            <th class="amt">${esc(a)} paid</th>
            <th class="amt">${esc(b)} paid</th>
            <th>Between you</th>
          </tr>
        </thead>
        <tbody>
          ${whoSummaryRow("Overall", overall, true)}
          ${whoSummaryRow("Contracts", cBal)}
          ${whoSummaryRow("House", hBal)}
          ${whoSummaryRow("Trips", tBal)}
        </tbody>
      </table>
    </div>
    <div style="margin-top:16px">${renderPnl(from, to)}</div>
    <div class="card" style="overflow:auto;margin-top:16px">
      <h3>Who owes whom — detail</h3>
      <table class="pnl-table">
        <thead>
          <tr>
            <th class="name">Item</th>
            <th class="amt">Spend</th>
            <th class="amt">${esc(a)} paid</th>
            <th class="amt">${esc(b)} paid</th>
            <th>Still to pay</th>
            <th>${esc(a)} still</th>
            <th>${esc(b)} still</th>
            <th>Between you</th>
          </tr>
        </thead>
        <tbody>
          ${group("contract", state.contracts, "Contracts")}
          ${group("house", state.house, "House")}
          ${group("trip", state.trips, "Trips") || `<tr><td colspan="8">Nothing in this range.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="card" style="margin-top:16px"><h3>All payments</h3>${expenseRows(filterExp(null, null, from, to))}</div>
    ${transferRows(state.transfers.filter(t => (!from || t.date >= from) && (!to || t.date <= to)))}
  `;
}

      </div>
    </div>
    <div class="card" style="margin-top:16px;max-width:520px">
      <h3>Backup</h3>
      <p class="muted">Extra copy on your computer. The live data is on the Pi.</p>
      <div class="toolbar">
        <button class="btn ghost" data-act="export">Export JSON</button>
        <label class="btn ghost" style="margin:0">Import JSON<input type="file" id="imp" accept="application/json" hidden /></label>
      </div>
      <div class="toolbar">
        <button class="btn ghost" data-act="demo">Load sample data</button>
        <button class="btn danger" data-act="clear">Clear everything</button>
      </div>
    </div>
  `;
}

function render() {
  const { parts } = route();
  const root = parts[0] || "";
  const id = parts[1];
  const active = "/" + (root || "");
  document.getElementById("side-nav").innerHTML = navHtml(active === "/" ? "/" : "/" + root);
  document.getElementById("bottom-nav").innerHTML = navHtml(active === "/" ? "/" : "/" + root);
  document.getElementById("side-property").textContent = state.settings.propertyName || "Household ledger";
  const overall = balance(state.expenses, state.transfers);
  document.getElementById("side-balance").innerHTML = (overall.even ? "Settled" : `${esc(nameOf(overall.debtor))} owes ${esc(money(overall.owed))}`) + (fx.date ? `<div style="margin-top:8px">ZAR rates ${esc(fx.date)}</div>` : "");
  let html = "";
  if (!root) html = renderOverview();
  else if (root === "contracts" && id) html = renderDetail("contract", id);
  else if (root === "contracts") html = renderList("contract");
  else if (root === "house" && id) html = renderDetail("house", id);
  else if (root === "house") html = renderList("house");
  else if (root === "rental" && id) html = renderDetail("rental", id);
  else if (root === "rental") html = renderList("rental");
  else if (root === "trips" && id) html = renderDetail("trip", id);
  else if (root === "trips") html = renderList("trip");
  else if (root === "report") html = renderReport();
  else if (root === "settings") html = renderSettings();
  else html = renderOverview();
  document.getElementById("view").innerHTML = html;
  document.title = (state.settings.propertyName || "Halves") + " · Halves";

  const set = document.getElementById("set-form");
  if (set) set.addEventListener("submit", (e) => {
    e.preventDefault();
    state.people.a.name = set.a.value.trim() || "Alex";
    state.people.b.name = set.b.value.trim() || "Sam";
    state.settings.propertyName = set.property.value.trim() || "Home";
    state.settings.currency = set.currency.value;
    state.settings.jointName = set.joint.value.trim() || "Capitec";
    save(); render();
  });
  const imp = document.getElementById("imp");
  if (imp) imp.addEventListener("change", () => {
    const f = imp.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d.people || !d.expenses) throw new Error("bad");
        state = normalize(d);
        delete state._rentalsMoved;
        save(); render();
      } catch { alert("That file is not a Halves backup."); }
    };
    reader.readAsText(f);
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) {
    if (e.target.id === "overlay") closeDialog();
    return;
  }
  const act = t.getAttribute("data-act");
  const kind = t.getAttribute("data-kind");
  const id = t.getAttribute("data-id");
  if (act === "close") closeDialog();
  if (act === "pay") paymentDialog({ kind, targetId: id });
  if (act === "repay") paymentDialog({ kind, targetId: id, repayment: true });
  if (act === "edit-pay") paymentDialog({ id });
  if (act === "del-pay") {
    if (!confirm("Delete this payment?")) return;
    state.expenses = state.expenses.filter(x => x.id !== id);
    save(); render();
  }
  if (act === "settle") settleDialog();
  if (act === "edit-xfer") settleDialog({ id });
  if (act === "del-xfer") {
    if (!confirm("Delete this transfer?")) return;
    state.transfers = state.transfers.filter(x => x.id !== id);
    save(); render();
  }
  if (act === "entity") {
    entityDialog(kind, id ? itemOf(kind, id) : null);
  }
  if (act === "fx-refresh") {
    fetchFx().then(ok => {
      if (!ok) alert("Could not reach the rate service. Check the internet connection, or type a rate on the payment.");
      render();
    });
  }
  if (act === "excel") downloadExcel();
  if (act === "reprint") render();
  if (act === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "halves-backup.json";
    a.click();
  }
  if (act === "save-pin") {
    const field = document.getElementById("pin-field");
    localStorage.setItem("halves-pin", (field?.value || "").trim());
    save(); render();
  }
  if (act === "demo") {
    if (confirm("Replace the Pi copy with the sample household?")) { state = clone(DEMO); save(); render(); }
  }
  if (act === "clear") {
    if (confirm("Erase all payments, contracts, trips, and house costs on the Pi and this browser?")) { state = emptyLedger(); save(); render(); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDialog(); });
window.addEventListener("hashchange", render);
pullFromServer().then(() => {
  render();
  fetchFx().then(ok => { if (ok) render(); });
});
</script>
</body>
</html>
