<html lang="en">
<head>

  <style>
    :root {
      --bg: #f3f1ec;
      --ink: #1c1b18;
      --muted: #6b675e;
      --line: #ddd8ce;
      --card: #fbfaf7;
      --paper: #ece8df;
      --navy: #1f2833;
      --navy-2: #2a3441;
      --cream: #ece8df;
      --owe: #8a4334;
      --credit: #2f4a3c;
      --danger: #8f3d32;

      --display: "Newsreader", Georgia, serif;
      --sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
      --radius: 14px;
      --sidebar: 240px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    input, select, textarea { font-family: inherit; font-size: 1rem; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: -.02em; margin: 0; }
    .app { min-height: 100vh; display: flex; }
    .sidebar {
      width: var(--sidebar);
      background: var(--navy);
      color: var(--cream);
      display: none;
      flex-direction: column;
      padding: 28px 18px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand { font-family: var(--display); font-size: 1.7rem; font-style: italic; color: #f4f1ea; }
    .brand span { display: block; font-family: var(--sans); font-style: normal; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #9aa3ad; margin-top: 4px; }
    .nav { margin-top: 36px; display: flex; flex-direction: column; gap: 4px; }
    .nav a, .nav button.link {
      display: flex; align-items: center; gap: 10px;
      color: #c5ccd3; padding: 10px 12px; border-radius: 10px;
      background: none; border: 0; text-align: left; font-size: .95rem;
    }
    .nav a.on, .nav a:hover, .nav button.link:hover { background: var(--navy-2); color: #f4f1ea; }
    .side-foot { margin-top: auto; padding-top: 20px; font-size: .8rem; color: #9aa3ad; }
    .main { flex: 1; min-width: 0; padding: 28px 22px 96px; max-width: 980px; }
    .page-kicker { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .page-title { font-size: clamp(1.8rem, 1.4rem + 1.6vw, 2.6rem); margin: 6px 0 8px; line-height: 1.15; }
    .lede { color: var(--muted); max-width: 40rem; margin-bottom: 24px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; gap: 14px; }
    .cards { display: grid; gap: 14px; grid-template-columns: 1fr; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
    }
    .card h3 { font-size: 1.25rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    .owe { color: var(--owe); }
    .credit { color: var(--credit); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600;
      background: var(--paper); color: var(--ink);
    }
    .pill.owe { background: #f3e4df; color: var(--owe); }
    .pill.even { background: #e4ece7; color: var(--credit); }
    .btn {
      border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600;
      background: var(--navy); color: #f4f1ea; font-size: .92rem;
    }
    .btn:hover { background: var(--navy-2); }
    .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn.ghost:hover { background: var(--paper); }
    .btn.danger { background: var(--danger); }
    .btn.sm { padding: 7px 11px; font-size: .82rem; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 20px; }
    .list-row {
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
      padding: 12px 0; border-top: 1px solid var(--line);
    }
    .list-row:first-child { border-top: 0; }
    .row-end { text-align: right; flex-shrink: 0; }
    .row-acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
    .progress { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
    .progress > i { display: block; height: 100%; background: var(--navy); border-radius: 99px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--navy); display: flex; justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .bottom a {
      color: #9aa3ad; font-size: .68rem; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 8px; min-width: 56px;
    }
    .bottom a.on { color: #f4f1ea; }
    .overlay {
      position: fixed; inset: 0; background: rgba(28,27,24,.42);
      display: none; align-items: flex-end; justify-content: center; z-index: 40; padding: 16px;
    }
    .overlay.open { display: flex; }
    .dialog {
      background: var(--card); width: min(520px, 100%);
      border-radius: 18px 18px 12px 12px; padding: 22px 20px 18px;
      max-height: min(88vh, 720px); overflow: auto;
      box-shadow: 0 20px 50px rgba(28,27,24,.25);
    }
    .dialog h2 { font-size: 1.55rem; margin-bottom: 14px; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin: 12px 0 6px; letter-spacing: .04em; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 10px; padding: 10px 12px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .split { display: flex; gap: 8px; align-items: center; }
    .empty { padding: 28px 8px; color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 18px; }
    .stats > div { background: var(--paper); border-radius: 12px; padding: 12px; }
    .stats .lbl { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .fx-box strong { font-variant-numeric: tabular-nums; }
    @media (min-width: 860px) {
      .sidebar { display: flex; }
      .bottom { display: none; }
      .main { padding: 40px 48px 64px; }
      .cards { grid-template-columns: 1fr 1fr; }
      .cards.three { grid-template-columns: 1fr 1fr 1fr; }
      .overlay { align-items: center; }
      .dialog { border-radius: 18px; }
    }
    @media print {
      .sidebar, .bottom, .toolbar, .btn, .overlay { display: none !important; }
      .main { padding: 0; max-width: none; }
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>

  ],
  transfers: [
    { id:"x1", date:"2026-08-01", amountCents:50000, from:"b", to:"a", kind:"overall", targetId:null, notes:"Catch-up on the house" }
  ]
};

function emptyLedger() {
  return {
    people: { a: { id: "a", name: "Alex" }, b: { id: "b", name: "Sam" } },
    settings: { propertyName: "Home", currency: "ZAR" },
    contracts: [], house: [], trips: [], expenses: [], transfers: []
  };
}

function clone(v) { return JSON.parse(JSON.stringify(v)); }

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEMO);
    const d = JSON.parse(raw);
    if (!d || !d.people || !d.expenses) return clone(DEMO);
    d.house = d.house || d.houseCategories || [];
    d.contracts = d.contracts || [];
    d.trips = d.trips || [];
    d.transfers = d.transfers || [];
    return d;
  } catch {
    return clone(DEMO);
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

let state = load();
let fx = loadFx();

function loadFx() {
  try {
    const raw = localStorage.getItem(FX_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.rates) return d;
    }
  } catch {}
  return { rates: { ZAR: 1 }, date: "", fetchedAt: "", source: "" };
}
function saveFx() {
  localStorage.setItem(FX_KEY, JSON.stringify(fx));
}

function currencyOpts(selected) {
  return CURRENCIES.map(c => `<option value="${c}" ${c===selected?"selected":""}>${c}</option>`).join("");
}

function moneyIn(cents, currency) {
  const code = currency || state.settings.currency || "ZAR";
  try {
    return new Intl.NumberFormat(code === "ZAR" ? "en-ZA" : undefined, { style: "currency", currency: code }).format((cents || 0) / 100);
  } catch {
    return ((cents || 0) / 100).toFixed(2) + " " + code;
  }
}
function moneyZar(cents) { return moneyIn(cents, "ZAR"); }

function tripOf(id) { return state.trips.find(t => t.id === id); }
function expenseCurrency(e) {
  if (e.currency) return e.currency;
  if (e.kind === "trip") return tripOf(e.targetId)?.currency || state.settings.currency;
  return state.settings.currency || "ZAR";
}
function zarPerUnit(currency) {
  if (!currency || currency === "ZAR") return 1;
  const r = Number(fx.rates[currency]);
  return r > 0 ? r : null;
}
function toZarCents(amountCents, currency, rateOverride) {
  if (!currency || currency === "ZAR") return amountCents;
  const r = rateOverride != null && rateOverride !== "" ? Number(rateOverride) : zarPerUnit(currency);
  if (!r || !isFinite(r)) return null;
  return Math.round(amountCents * r);
}
function ledgerCents(e) {
  const from = expenseCurrency(e);
  const to = state.settings.currency || "ZAR";
  if (from === to) return e.amountCents;
  const zar = e.zarCents != null ? e.zarCents : toZarCents(e.amountCents, from, e.fxRate);
  if (zar == null) return e.amountCents;
  if (to === "ZAR") return zar;
  const rTo = zarPerUnit(to);
  if (!rTo) return e.amountCents;
  return Math.round(zar / rTo);
}

async function fetchFx() {
  const setRatesFromUsd = (usdRates, date, source) => {
    const usdZar = Number(usdRates.ZAR);
    if (!usdZar) throw new Error("no ZAR");
    const rates = { ZAR: 1, USD: usdZar };
    for (const c of CURRENCIES) {
      if (c === "ZAR" || c === "USD") continue;
      const usdPer = Number(usdRates[c]);
      if (usdPer > 0) rates[c] = usdZar / usdPer;
    }
    fx = { rates, date: date || today(), fetchedAt: new Date().toISOString(), source };
    saveFx();
  };
  try {
    const res = await fetch("https://api.frankfurter.dev/v1/latest?from=USD");
    if (!res.ok) throw new Error("frankfurter");
    const data = await res.json();
    setRatesFromUsd(data.rates, data.date, "Frankfurter (ECB)");
    return true;
  } catch {
    try {
      const res = await fetch("https://open.er-api.com/v6/latest/USD");
      if (!res.ok) throw new Error("er-api");
      const data = await res.json();
      setRatesFromUsd(data.rates || data.conversion_rates, data.time_last_update_utc, "open.er-api.com");
      return true;
    } catch {
      return false;
    }
  }
}

function fxLine(currency) {
  if (!currency || currency === "ZAR") return "Already rand.";
  const r = zarPerUnit(currency);
  if (!r) return "No rate yet — enter one, or refresh in Settings.";
  return `1 ${currency} = ${moneyZar(Math.round(r * 100)).replace("R","R ").trim()} (${fx.date || "latest"})`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function uid() { return crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + Math.random().toString(16).slice(2); }
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function money(cents) {
  return moneyIn(cents, state.settings.currency || "ZAR");
}
function prettyDate(iso) {
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(new Date(y, m-1, d));
}
function nameOf(id) { return state.people[id]?.name || id; }
function dollarsToCents(v) {
  const n = parseFloat(String(v).replace(/,/g, ""));
  if (!isFinite(n) || n < 0) return null;
  return Math.round(n * 100);
}

function balance(expenses, transfers) {
  let total = 0, paidA = 0, paidB = 0, shareA = 0;
  for (const e of expenses) {
    const cents = ledgerCents(e);
    total += cents;
    if (e.paidBy === "a") paidA += cents; else paidB += cents;
    shareA += Math.round((cents * (e.splitA ?? 50)) / 100);
  }
  let netA = paidA - shareA;
  for (const t of transfers) {
    if (t.from === "a" && t.to === "b") netA += t.amountCents;
    else if (t.from === "b" && t.to === "a") netA -= t.amountCents;
  }
  const owed = Math.abs(netA);
  const even = owed < 1;
  return {
    total, paidA, paidB, shareA, shareB: total - shareA, netA,
    even,
    debtor: even ? null : (netA > 0 ? "b" : "a"),
    creditor: even ? null : (netA > 0 ? "a" : "b"),
    owed
  };
}
function filterExp(kind, id, from, to) {
  return state.expenses.filter(e => {
    if (kind && e.kind !== kind) return false;
    if (id && e.targetId !== id) return false;
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    return true;
  });
}
function filterXfer(kind, id, from, to) {
  return state.transfers.filter(t => {
    if (kind && kind !== "overall") {
      if (t.kind !== kind) return false;
      if (id && t.targetId !== id) return false;
    }
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    return true;
  });
}
function whoLine(bal) {
  if (bal.even) return `<span class="pill even">Settled</span>`;
  return `<span class="pill owe">${esc(nameOf(bal.debtor))} owes ${esc(nameOf(bal.creditor))} ${esc(money(bal.owed))}</span>`;
}
function contractPaid(id) {
  return balance(filterExp("contract", id), []).total;
}
function stillToPay(totalCents, paidCents) {
  if (totalCents == null) return null;
  return totalCents - (paidCents || 0);
}
function remainingLine(totalCents, paidCents) {
  const left = stillToPay(totalCents, paidCents);
  if (left == null) return `<div class="muted">Set a contract total to track what is still due to the contractor.</div>`;
  if (left <= 0) return `<span class="pill even">${left < 0 ? "Overpaid " + esc(money(-left)) : "Paid in full"}</span>`;
  return `<span class="pill owe">Still to pay ${esc(money(left))}</span>`;
}
function remainingStats(totalCents, paidCents) {
  if (totalCents == null) return remainingLine(null);
  const left = stillToPay(totalCents, paidCents);
  const pct = totalCents ? Math.min(100, Math.max(0, Math.round((paidCents / totalCents) * 100))) : 0;
  return `
    <div class="stats">
      <div><div class="lbl">Contract total</div><div class="amount">${esc(money(totalCents))}</div></div>
      <div><div class="lbl">Paid so far</div><div class="amount">${esc(money(paidCents))}</div></div>
      <div><div class="lbl">Still to pay</div><div class="amount">${left <= 0 ? esc(money(0)) : esc(money(left))}</div></div>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin:8px 0 14px">${remainingLine(totalCents, paidCents)}</div>`;
}
function contractorsOutstanding() {
  let due = 0, paid = 0;
  for (const c of state.contracts) {
    if (c.totalCents == null) continue;
    due += c.totalCents;
    paid += contractPaid(c.id);
  }
  return { due, paid, remaining: due - paid };
}

function route() {
  const h = (location.hash || "#/").replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean);
  return { parts, path: "/" + parts.join("/") };
}

function navHtml(active) {
  const items = [
    ["/", "Overview", ICONS.home],
    ["/contracts", "Contracts", ICONS.scroll],
    ["/house", "House", ICONS.house],
    ["/trips", "Trips", ICONS.palm],
    ["/report", "Report", ICONS.report],
    ["/settings", "Settings", ICONS.gear]
  ];
  return items.map(([href, label, icon]) => {
    const on = active === href || (href !== "/" && active.startsWith(href));
    return `<a href="#${href}" class="${on ? "on" : ""}">${icon}${label}</a>`;
  }).join("");
}

function closeDialog() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("overlay").innerHTML = "";
}
function openDialog(html) {

}

function targetsFor(kind) {
  if (kind === "contract") return state.contracts.map(x => ({ id: x.id, name: x.name }));
  if (kind === "house") return state.house.map(x => ({ id: x.id, name: x.name }));
  return state.trips.map(x => ({ id: x.id, name: x.name }));
}

    const tripCcy = tripOf(form.targetId.value)?.currency;

    const ccy = form.currency.value;
    if (!form.fxRate.value || form.kind.value === "trip") {
      const live = zarPerUnit(ccy);
      if (live && (form.kind.value !== "trip" || !existing || !form.fxRate.dataset.locked)) {
        if (!existing) form.fxRate.value = live.toFixed(4);
      }
    }
    const cents = dollarsToCents(form.amount.value) || 0;
    const rate = Number(form.fxRate.value);
    const zar = toZarCents(cents, ccy, rate);
    const box = document.getElementById("fx-preview");
    const fields = document.getElementById("fx-fields");
    fields.style.display = form.kind.value === "trip" || ccy !== "ZAR" ? "block" : "block";
    if (ccy === "ZAR") {
      box.innerHTML = `Coded in rand: <strong>${esc(moneyZar(cents))}</strong>`;
    } else if (zar == null) {
      box.innerHTML = `No ZAR rate for ${esc(ccy)}. Refresh the live rate or type one.`;
    } else {
      box.innerHTML = `${esc(moneyIn(cents, ccy))} → <strong>${esc(moneyZar(zar))}</strong><div class="muted">${esc(fxLine(ccy))}. This ZAR amount is stored on save.</div>`;
    }
  };
  form.kind.addEventListener("change", () => {
    const k = form.kind.value;
    const t = targetsFor(k);
    form.targetId.innerHTML = t.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("") || "<option value=''>None yet</option>";
    if (k === "trip") {
      const tc = tripOf(form.targetId.value)?.currency;
      if (tc) form.currency.value = tc;
    } else {
      form.currency.value = state.settings.currency || "ZAR";
    }
    const live = zarPerUnit(form.currency.value);
    if (live) form.fxRate.value = live.toFixed(4);
    syncFx();
  });
  form.targetId.addEventListener("change", () => {
    if (form.kind.value === "trip") {
      const tc = tripOf(form.targetId.value)?.currency;
      if (tc) {
        form.currency.value = tc;
        const live = zarPerUnit(tc);
        if (live) form.fxRate.value = live.toFixed(4);
      }
    }
    syncFx();
  });
  form.amount.addEventListener("input", syncFx);
  form.currency.addEventListener("change", () => {
    const live = zarPerUnit(form.currency.value);
    if (live) form.fxRate.value = live.toFixed(4);
    syncFx();
  });
  form.fxRate.addEventListener("input", () => { form.fxRate.dataset.locked = "1"; syncFx(); });
  document.getElementById("fx-refresh").addEventListener("click", async () => {
    const ok = await fetchFx();
    const live = zarPerUnit(form.currency.value);
    if (live) { form.fxRate.value = live.toFixed(4); delete form.fxRate.dataset.locked; }
    if (!ok && !live) alert("Could not fetch a live rate. Type the bank rate yourself.");
    syncFx();
  });
  syncFx();
  const toggleSplit = () => {
    document.getElementById("custom-split").style.display = form.splitMode.value === "custom" ? "block" : "none";
  };
  form.splitMode.addEventListener("change", toggleSplit);
  toggleSplit();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const cents = dollarsToCents(form.amount.value);
    if (cents == null || !form.targetId.value) return;
    const mode = form.splitMode.value;
    let splitA;
    if (mode === "half") splitA = 50;
    else if (mode === "own") splitA = form.paidBy.value === "a" ? 100 : 0;
    else {
      const n = Number(form.splitA.value);
      splitA = Math.max(0, Math.min(100, Number.isFinite(n) ? n : 50));
    }
    const ccy = form.currency.value || state.settings.currency;
    const rate = Number(form.fxRate.value);
    const zar = toZarCents(cents, ccy, rate);
    const row = {
      id: existing?.id || uid(),
      kind: form.kind.value,
      targetId: form.targetId.value,
      date: form.date.value,
      description: form.description.value.trim(),
      amountCents: cents,
      paidBy: form.paidBy.value,
      splitA,
      currency: ccy,
      fxRate: ccy === "ZAR" ? 1 : (rate || null),
      fxDate: fx.date || today(),
      zarCents: zar
    };
    if (existing) state.expenses = state.expenses.map(x => x.id === existing.id ? row : x);
    else state.expenses.push(row);
    save(); closeDialog(); render();
  });
  const del = document.getElementById("del-pay-btn");
  if (del) del.addEventListener("click", () => {
    if (!confirm("Delete this payment?")) return;
    state.expenses = state.expenses.filter(x => x.id !== existing.id);
    save(); closeDialog(); render();
  });
}

  const overall = balance(state.expenses, state.transfers);
  const cBal = balance(filterExp("contract"), filterXfer("contract"));
  const hBal = balance(filterExp("house"), filterXfer("house"));
  const tBal = balance(filterExp("trip"), filterXfer("trip"));
  const recent = [...state.expenses.map(e => ({...e, _t:"pay"})), ...state.transfers.map(t => ({...t, _t:"xfer"}))]

}

function renderList(kind) {
  const cfg = {
    contract: { title: "Contracts", add: "New contract", items: state.contracts, href: (id) => "/contracts/" + id, empty: "No contracts yet. Add a builder, solar, or service agreement." },
    house: { title: "House costs", add: "New category", items: state.house, href: (id) => "/house/" + id, empty: "No house categories yet. Try rates, insurance, utilities." },
    trip: { title: "Trips", add: "New trip", items: state.trips, href: (id) => "/trips/" + id, empty: "No trips yet." }
  }[kind];
  const cards = cfg.items.map(item => {
    const bal = balance(filterExp(kind, item.id), filterXfer(kind, item.id));
    let meta = item.vendor || item.location || item.notes || "";
    if (kind === "trip") {
      const ccy = item.currency || "ZAR";
      const dates = item.startDate ? prettyDate(item.startDate) + (item.endDate ? " – " + prettyDate(item.endDate) : "") : "";
      meta = [item.location, ccy, dates].filter(Boolean).join(" · ");
    }
    let extra = "";
    if (kind === "contract") {
      extra = remainingStats(item.totalCents, bal.total);
    }
    return bucketCard(cfg.href(item.id), item.name, meta, bal, extra);
  }).join("");
  return `
    <div class="page-kicker">Ledger</div>
    <h1 class="page-title">${cfg.title}</h1>
    <div class="toolbar">
      <button class="btn" data-act="entity" data-kind="${kind}">${cfg.add}</button>
      <button class="btn ghost" data-act="pay" data-kind="${kind}">Add payment</button>
    </div>
    <div class="cards">${cards || `<div class="card empty">${cfg.empty}</div>`}</div>
  `;
}

function renderDetail(kind, id) {
  const item = (kind === "contract" ? state.contracts : kind === "house" ? state.house : state.trips).find(x => x.id === id);
  if (!item) return `<h1 class="page-title">Not found</h1><p><a href="#/${kind === "trip" ? "trips" : kind === "house" ? "house" : "contracts"}">Back</a></p>`;
  const ex = filterExp(kind, id);
  const xf = filterXfer(kind, id);
  const bal = balance(ex, xf);
  let extra = "";
  if (kind === "contract") extra = remainingStats(item.totalCents, bal.total);
  const back = kind === "trip" ? "/trips" : kind === "house" ? "/house" : "/contracts";
  return `
    <div class="page-kicker"><a href="#${back}">← ${kind === "trip" ? "Trips" : kind === "house" ? "House" : "Contracts"}</a></div>
    <h1 class="page-title">${esc(item.name)}</h1>
    <p class="lede">${esc(item.vendor || item.location || item.notes || "")}${kind === "trip" ? ` · Spend in ${esc(item.currency || "ZAR")}, coded to rand.` : ""}</p>
    ${extra}
    <p>${whoLine(bal)}</p>
    <div class="toolbar">
      <button class="btn" data-act="pay" data-kind="${kind}" data-id="${esc(id)}">Add payment</button>
      <button class="btn ghost" data-act="settle">Settle up</button>
      <button class="btn ghost" data-act="entity" data-kind="${kind}" data-id="${esc(id)}">Edit</button>
    </div>
    <div class="card"><h3>Payments</h3>${expenseRows(ex)}</div>
    ${transferRows(xf)}
  `;
}

function itemName(kind, id) {
  if (kind === "contract") return state.contracts.find(x => x.id === id)?.name || id;
  if (kind === "house") return state.house.find(x => x.id === id)?.name || id;
  if (kind === "trip") return state.trips.find(x => x.id === id)?.name || id;
  return "Overall";
}
function categoryLabel(kind) {
  return { contract: "Contract", house: "House", trip: "Trip", overall: "Overall" }[kind] || kind || "";
}
function xNum(cents) { return ((cents || 0) / 100).toFixed(2); }
function xCell(value, type, style) {
  if (type === "Number") {
    const n = value == null || value === "" ? "" : String(value);
    if (n === "") return `<Cell><Data ss:Type="String"></Data></Cell>`;
    return `<Cell ss:StyleID="${style || "money"}"><Data ss:Type="Number">${n}</Data></Cell>`;
  }
  return `<Cell${style ? ` ss:StyleID="${style}"` : ""}><Data ss:Type="String">${esc(value ?? "")}</Data></Cell>`;
}
function xRow(cells) { return `<Row>${cells.join("")}</Row>`; }
function xSheet(name, bodyRows) {
  const safe = String(name).replace(/[\\/*?:\[\]]/g, " ").slice(0, 31);
  return `<Worksheet ss:Name="${esc(safe)}"><Table>${bodyRows.join("")}</Table></Worksheet>`;
}
function headerRow(cols) {
  return xRow(cols.map(h => xCell(h, "String", "header")));
}
function sectionRow(text, span) {
  return `<Row><Cell ss:StyleID="section" ss:MergeAcross="${Math.max(0, (span || 8) - 1)}"><Data ss:Type="String">${esc(text)}</Data></Cell></Row>`;
}
function blankRow() { return `<Row></Row>`; }
function pivotBlock(title, headers, rows) {
  return [sectionRow(title, headers.length), headerRow(headers), ...rows, blankRow()];
}
function oweSentence(label, b) {
  if (!b || b.even) return `${label}: Settled — nobody owes anyone`;
  return `${label}: ${nameOf(b.debtor)} owes ${nameOf(b.creditor)} ${money(b.owed)}`;
}
function catBalance(buckets, cat) {
  const list = buckets.filter(g => g.cat === cat);
  return balance(list.flatMap(g => g.exp), list.flatMap(g => g.xf));
}
function reportBuckets(from, to) {
  const groups = [
    { cat: "Overall", name: "All categories", kind: "overall", id: null, exp: filterExp(null, null, from, to), xf: state.transfers.filter(t => (!from || t.date >= from) && (!to || t.date <= to)) },
    ...state.contracts.map(c => ({ cat: "Contract", name: c.name, kind: "contract", id: c.id, totalCents: c.totalCents, exp: filterExp("contract", c.id, from, to), xf: filterXfer("contract", c.id, from, to) })),
    ...state.house.map(c => ({ cat: "House", name: c.name, kind: "house", id: c.id, exp: filterExp("house", c.id, from, to), xf: filterXfer("house", c.id, from, to) })),
    ...state.trips.map(c => ({ cat: "Trip", name: c.name, kind: "trip", id: c.id, exp: filterExp("trip", c.id, from, to), xf: filterXfer("trip", c.id, from, to) }))
  ];
  return groups.map(g => ({ ...g, bal: balance(g.exp, g.xf) }));
}

  }
  const overallB = buckets.find(g => g.cat === "Overall")?.bal || balance([], []);
  catPivotRows.push(xRow([
    xCell("Grand total", "String", "totaltxt"),
    xCell(buckets.filter(g => g.cat !== "Overall" && (g.exp.length || g.xf.length)).length, "Number", "total"),
    xCell(buckets.find(g => g.cat === "Overall")?.exp.length || 0, "Number", "total"),

    ...state.contracts.map(c => {

    const row = payByCat[cat][item];
    const amt = ledgerCents(e);
    const zar = e.zarCents != null ? e.zarCents : (toZarCents(e.amountCents, expenseCurrency(e), e.fxRate) || 0);
    row.n += 1; row.total += amt; row.zar += zar || 0;
    if (e.paidBy === "a") row.a += amt; else row.b += amt;
  }
  let gpN = 0, gpA = 0, gpB = 0, gpT = 0, gpZ = 0;
  for (const cat of cats) {
    const items = payByCat[cat];
    if (!items) continue;
    let cN = 0, cA = 0, cB = 0, cT = 0, cZ = 0;
    for (const item of Object.keys(items)) {
      const r = items[item];
      cN += r.n; cA += r.a; cB += r.b; cT += r.total; cZ += r.zar;
      payPivotRows.push(xRow([
        xCell(cat), xCell(item), xCell(r.n, "Number"), xCell(xNum(r.a), "Number"),
        xCell(xNum(r.b), "Number"), xCell(xNum(r.total), "Number"), xCell(xNum(r.zar), "Number")
      ]));
    }
    gpN += cN; gpA += cA; gpB += cB; gpT += cT; gpZ += cZ;
    payPivotRows.push(xRow([
      xCell(cat + " total", "String", "totaltxt"), xCell("", "String", "totaltxt"),
      xCell(cN, "Number", "total"), totStyle(cA), totStyle(cB), totStyle(cT), totStyle(cZ)
    ]));
  }
  payPivotRows.push(xRow([
    xCell("Grand total", "String", "totaltxt"), xCell(""), xCell(gpN, "Number", "total"),
    totStyle(gpA), totStyle(gpB), totStyle(gpT), totStyle(gpZ)
  ]));
  const payBody = [
    ...pivotBlock("Pivot: category × payer", ["Category", aName, bName, "Total ("+ledger+")"], (() => {
      const rows = []; let tA = 0, tB = 0;
      for (const cat of cats) {
        const list = payList.filter(e => categoryLabel(e.kind) === cat);
        const a = list.filter(e => e.paidBy === "a").reduce((s, e) => s + ledgerCents(e), 0);
        const b = list.filter(e => e.paidBy === "b").reduce((s, e) => s + ledgerCents(e), 0);
        tA += a; tB += b;
        if (!list.length) continue;
        rows.push(xRow([xCell(cat), xCell(xNum(a), "Number"), xCell(xNum(b), "Number"), totStyle(a + b)]));
      }
      rows.push(xRow([xCell("Grand total", "String", "totaltxt"), totStyle(tA), totStyle(tB), totStyle(tA + tB)]));
      return rows;
    })()),
    ...pivotBlock("Pivot by category and item", payPivotHeader, payPivotRows),
    sectionRow("Detail", payHeader.length),
    headerRow(payHeader),
    ...payDetail
  ];

  const xfList = state.transfers.filter(t => (!from || t.date >= from) && (!to || t.date <= to)).slice().sort((a,b) => a.date.localeCompare(b.date));
  const xfHeader = ["Date","From","To","Amount ("+ledger+")","Applied to","Item","Note"];
  const xfDetail = xfList.map(t => xRow([
    xCell(t.date), xCell(nameOf(t.from)), xCell(nameOf(t.to)), xCell(xNum(t.amountCents), "Number"),
    xCell(categoryLabel(t.kind) || "Overall"), xCell(t.targetId ? itemName(t.kind, t.targetId) : "Overall"), xCell(t.notes || "")
  ]));
  const xfPivotHeader = ["Category","Item","Transfers", aName+" → "+bName, bName+" → "+aName, "Net to "+aName];
  const xfPivotRows = [];
  const xfBy = {};
  for (const t of xfList) {
    const cat = categoryLabel(t.kind) || "Overall";
    const item = t.targetId ? itemName(t.kind, t.targetId) : "Overall";
    xfBy[cat] = xfBy[cat] || {};
    xfBy[cat][item] = xfBy[cat][item] || { n: 0, ab: 0, ba: 0 };
    const row = xfBy[cat][item];
    row.n += 1;
    if (t.from === "a" && t.to === "b") row.ab += t.amountCents;
    if (t.from === "b" && t.to === "a") row.ba += t.amountCents;
  }
  let xn = 0, xab = 0, xba = 0;
  for (const cat of [...cats, "Overall"]) {
    const items = xfBy[cat];
    if (!items) continue;
    let cN = 0, cAB = 0, cBA = 0;
    for (const item of Object.keys(items)) {
      const r = items[item];
      cN += r.n; cAB += r.ab; cBA += r.ba;
      xfPivotRows.push(xRow([
        xCell(cat), xCell(item), xCell(r.n, "Number"), xCell(xNum(r.ab), "Number"),
        xCell(xNum(r.ba), "Number"), xCell(xNum(r.ba - r.ab), "Number")
      ]));
    }
    xn += cN; xab += cAB; xba += cBA;
    xfPivotRows.push(xRow([
      xCell(cat + " total", "String", "totaltxt"), xCell(""), xCell(cN, "Number", "total"),
      totStyle(cAB), totStyle(cBA), totStyle(cBA - cAB)
    ]));
  }
  xfPivotRows.push(xRow([
    xCell("Grand total", "String", "totaltxt"), xCell(""), xCell(xn, "Number", "total"),
    totStyle(xab), totStyle(xba), totStyle(xba - xab)
  ]));
  const xfBody = [
    ...pivotBlock("Pivot: category × direction", ["Category", aName+" → "+bName, bName+" → "+aName, "Net to "+aName], (() => {
      const rows = []; let tAB = 0, tBA = 0;
      for (const cat of [...cats, "Overall"]) {
        const items = xfBy[cat];
        if (!items) continue;
        const ab = Object.values(items).reduce((s, r) => s + r.ab, 0);
        const ba = Object.values(items).reduce((s, r) => s + r.ba, 0);
        tAB += ab; tBA += ba;
        rows.push(xRow([xCell(cat), xCell(xNum(ab), "Number"), xCell(xNum(ba), "Number"), totStyle(ba - ab)]));
      }
      rows.push(xRow([xCell("Grand total", "String", "totaltxt"), totStyle(tAB), totStyle(tBA), totStyle(tBA - tAB)]));
      return rows;
    })()),
    ...pivotBlock("Pivot by category and item", xfPivotHeader, xfPivotRows),
    sectionRow("Detail", xfHeader.length),
    headerRow(xfHeader),
    ...xfDetail
  ];

  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
  <Style ss:ID="header"><Font ss:Bold="1"/></Style>
  <Style ss:ID="section"><Font ss:Bold="1" ss:Size="12"/></Style>
  <Style ss:ID="money"><NumberFormat ss:Format="#,##0.00"/></Style>
  <Style ss:ID="total"><Font ss:Bold="1"/><NumberFormat ss:Format="#,##0.00"/></Style>
  <Style ss:ID="totaltxt"><Font ss:Bold="1"/></Style>
  <Style ss:ID="owehead"><Font ss:Bold="1" ss:Size="14"/></Style>
  <Style ss:ID="oweline"><Font ss:Size="12"/></Style>
</Styles>
${xSheet("Who owes whom", whoBody)}
${xSheet("Summary", summaryBody)}
${xSheet("Track", trackBody)}
${xSheet("Payments", payBody)}
${xSheet("Settlements", xfBody)}
</Workbook>`;
  const blob = new Blob(["\uFEFF" + xml], { type: "application/vnd.ms-excel" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const range = (from || to) ? `-${from || "start"}-to-${to || "end"}` : "-" + today();
  a.download = `Halves-report${range}.xls`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderReport() {
  const from = document.getElementById("r-from")?.value || "";
  const to = document.getElementById("r-to")?.value || "";
  const kinds = [
    { key: "overall", label: "Overall", exp: filterExp(null, null, from, to), xf: filterXfer("overall", null, from, to) },
    ...state.contracts.map(c => ({ key: c.id, label: "Contract · " + c.name, exp: filterExp("contract", c.id, from, to), xf: filterXfer("contract", c.id, from, to) })),
    ...state.house.map(c => ({ key: c.id, label: "House · " + c.name, exp: filterExp("house", c.id, from, to), xf: filterXfer("house", c.id, from, to) })),
    ...state.trips.map(c => ({ key: c.id, label: "Trip · " + c.name, exp: filterExp("trip", c.id, from, to), xf: filterXfer("trip", c.id, from, to) }))
  ];
  const rows = kinds.map(k => {
    const b = balance(k.exp, k.xf);
    if (!k.exp.length && !k.xf.length && k.key !== "overall") {
      const con = state.contracts.find(c => c.id === k.key);
      if (!con) return "";
    }
    const con = state.contracts.find(c => c.id === k.key);
    const left = con && con.totalCents != null ? stillToPay(con.totalCents, contractPaid(con.id)) : null;
    const leftTxt = left == null ? "—" : (left <= 0 ? "Paid in full" : money(left));
    const line = b.even ? "Settled" : `${nameOf(b.debtor)} owes ${nameOf(b.creditor)} ${money(b.owed)}`;
    return `<tr><td>${esc(k.label)}</td><td>${esc(money(b.total))}</td><td>${esc(nameOf("a"))} ${esc(money(b.paidA))}</td><td>${esc(nameOf("b"))} ${esc(money(b.paidB))}</td><td>${esc(leftTxt)}</td><td class="${b.even ? "credit" : "owe"}">${esc(line)}</td></tr>`;
  }).join("");
  const overall = balance(filterExp(null, null, from, to), filterXfer("overall", null, from, to));
  return `
    <div class="page-kicker">Statement</div>
    <h1 class="page-title">Who owes whom</h1>
    <p class="lede">${overall.even ? "Settled across the selected dates." : `${esc(nameOf(overall.debtor))} owes ${esc(nameOf(overall.creditor))} <strong>${esc(money(overall.owed))}</strong>.`}</p>
    <div class="toolbar">
      <label style="margin:0">From <input id="r-from" type="date" value="${esc(from)}" /></label>
      <label style="margin:0">To <input id="r-to" type="date" value="${esc(to)}" /></label>
      <button class="btn ghost sm" data-act="reprint">Apply dates</button>
      <button class="btn" data-act="excel">Download Excel</button>
      <button class="btn ghost sm" onclick="window.print()">Print</button>
    </div>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr><th>Bucket</th><th>Spend</th><th>${esc(nameOf("a"))} paid</th><th>${esc(nameOf("b"))} paid</th><th>Still to pay contractor</th><th>Between you</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5">Nothing in this range.</td></tr>`}</tbody>
      </table>
    </div>
    <div class="card" style="margin-top:16px"><h3>All payments</h3>${expenseRows(filterExp(null, null, from, to))}</div>
    ${transferRows(state.transfers.filter(t => (!from || t.date >= from) && (!to || t.date <= to)))}
  `;
}

function renderSettings() {
  return `
    <div class="page-kicker">Preferences</div>
    <h1 class="page-title">Settings</h1>
    <form id="set-form" class="card" style="max-width:520px">
      <label>Your name</label>
      <input name="a" value="${esc(nameOf("a"))}" />
      <label>Partner’s name</label>
      <input name="b" value="${esc(nameOf("b"))}" />
      <label>House / property name</label>
      <input name="property" value="${esc(state.settings.propertyName)}" />
      <label>Ledger currency</label>
      <select name="currency">${currencyOpts(state.settings.currency || "ZAR")}</select>
      <p class="muted">House and contract costs use this. Trip costs in other currencies are converted into this using the ZAR rate.</p>
      <div class="toolbar" style="margin-top:16px"><button class="btn" type="submit">Save</button></div>
    </form>
    <div class="card" style="margin-top:16px;max-width:520px">
      <h3>Live rates into rand</h3>
      <p class="muted">${fx.source ? esc(fx.source) + (fx.date ? " · " + esc(fx.date) : "") : "Not fetched yet. Needs an internet connection."}</p>
      <table>
        <thead><tr><th>Currency</th><th>ZAR per 1</th></tr></thead>
        <tbody>
          ${CURRENCIES.filter(c => c !== "ZAR").map(c => `<tr><td>${c}</td><td>${zarPerUnit(c) ? Number(zarPerUnit(c)).toFixed(4) : "—"}</td></tr>`).join("")}
        </tbody>
      </table>
      <div class="toolbar"><button class="btn ghost" type="button" data-act="fx-refresh">Refresh rates</button></div>
    </div>
    <div class="card" style="margin-top:16px;max-width:520px">
      <h3>Backup</h3>
      <p class="muted">This file stores data in this browser only. Export a copy if you care about it.</p>
      <div class="toolbar">
        <button class="btn ghost" data-act="export">Export JSON</button>
        <label class="btn ghost" style="margin:0">Import JSON<input type="file" id="imp" accept="application/json" hidden /></label>
      </div>
      <div class="toolbar">
        <button class="btn ghost" data-act="demo">Load sample data</button>
        <button class="btn danger" data-act="clear">Clear everything</button>
      </div>
    </div>
  `;
}

function render() {
  const { parts } = route();
  const root = parts[0] || "";
  const id = parts[1];
  const active = "/" + (root || "");
  document.getElementById("side-nav").innerHTML = navHtml(active === "/" ? "/" : "/" + root);
  document.getElementById("bottom-nav").innerHTML = navHtml(active === "/" ? "/" : "/" + root);
  document.getElementById("side-property").textContent = state.settings.propertyName || "Household ledger";
  const overall = balance(state.expenses, state.transfers);
  document.getElementById("side-balance").innerHTML = (overall.even ? "Settled" : `${esc(nameOf(overall.debtor))} owes ${esc(money(overall.owed))}`) + (fx.date ? `<div style="margin-top:8px">ZAR rates ${esc(fx.date)}</div>` : "");
  let html = "";
  if (!root) html = renderOverview();
  else if (root === "contracts" && id) html = renderDetail("contract", id);
  else if (root === "contracts") html = renderList("contract");
  else if (root === "house" && id) html = renderDetail("house", id);
  else if (root === "house") html = renderList("house");
  else if (root === "trips" && id) html = renderDetail("trip", id);
  else if (root === "trips") html = renderList("trip");
  else if (root === "report") html = renderReport();
  else if (root === "settings") html = renderSettings();
  else html = renderOverview();
  document.getElementById("view").innerHTML = html;
  document.title = (state.settings.propertyName || "Halves") + " · Halves";

  const set = document.getElementById("set-form");
  if (set) set.addEventListener("submit", (e) => {
    e.preventDefault();
    state.people.a.name = set.a.value.trim() || "Alex";
    state.people.b.name = set.b.value.trim() || "Sam";
    state.settings.propertyName = set.property.value.trim() || "Home";
    state.settings.currency = set.currency.value;
    save(); render();
  });
  const imp = document.getElementById("imp");
  if (imp) imp.addEventListener("change", () => {
    const f = imp.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d.people || !d.expenses) throw new Error("bad");
        state = d;
        state.house = d.house || d.houseCategories || [];
        save(); render();
      } catch { alert("That file is not a Halves backup."); }
    };
    reader.readAsText(f);
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) {
    if (e.target.id === "overlay") closeDialog();
    return;
  }
  const act = t.getAttribute("data-act");
  const kind = t.getAttribute("data-kind");
  const id = t.getAttribute("data-id");
  if (act === "close") closeDialog();
  if (act === "pay") paymentDialog({ kind, targetId: id });
  if (act === "edit-pay") paymentDialog({ id });
  if (act === "del-pay") {
    if (!confirm("Delete this payment?")) return;
    state.expenses = state.expenses.filter(x => x.id !== id);
    save(); render();
  }
  if (act === "settle") settleDialog();
  if (act === "edit-xfer") settleDialog({ id });
  if (act === "del-xfer") {
    if (!confirm("Delete this transfer?")) return;
    state.transfers = state.transfers.filter(x => x.id !== id);
    save(); render();
  }
  if (act === "entity") {
    const list = kind === "contract" ? state.contracts : kind === "house" ? state.house : state.trips;
    entityDialog(kind, id ? list.find(x => x.id === id) : null);
  }
  if (act === "fx-refresh") {
    fetchFx().then(ok => {
      if (!ok) alert("Could not reach the rate service. Check the internet connection, or type a rate on the payment.");
      render();
    });
  }
  if (act === "excel") downloadExcel();
  if (act === "reprint") render();
  if (act === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "halves-backup.json";
    a.click();
  }
  if (act === "demo") {
    if (confirm("Replace current data with the sample household?")) { state = clone(DEMO); save(); render(); }
  }
  if (act === "clear") {
    if (confirm("Erase all payments, contracts, trips, and house costs on this browser?")) { state = emptyLedger(); save(); render(); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDialog(); });
window.addEventListener("hashchange", render);
render();
fetchFx().then(ok => { if (ok) render(); });
</script>
</body>
</html>
